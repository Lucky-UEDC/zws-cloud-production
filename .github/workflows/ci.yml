name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  # Lets a branch be re-verified on demand without pushing a dummy commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      DATABASE_URL: postgresql://zwscloud_app:zwscloud_app@127.0.0.1:5432/zwscloud?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      ZWS_SKIP_SETTINGS_DB_DURING_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No pinned `version` here on purpose: packageManager in package.json is
        # the single source of truth. Pinning a second version made
        # pnpm/action-setup abort with "Multiple versions of pnpm specified",
        # which failed every workflow run including on main.
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prisma generate
        run: ./node_modules/.bin/prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Build image (immutable metadata)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute source fingerprint
        id: fingerprint
        run: |
          FP="$(find . -path ./node_modules -prune -o -type f -print | sort | xargs sha256sum | sha256sum | cut -c1-12)"
          echo "fp=${FP}" >> "$GITHUB_OUTPUT"

      # Deterministic, inspectable tag. The previous tag was a content hash,
      # which is fine for caching but easy to get wrong: the build runs inside
      # buildx, so with push=false nothing lands in the runner's local image
      # store unless we ask for `load: true`. Without it, the following
      # `docker image inspect` failed on a tag that genuinely did not exist,
      # which is why this step was never green on any commit.
      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          # `load` puts the built image into the runner's docker daemon so it
          # can actually be inspected. Without this the inspect below is a
          # lookup of a reference that was never created locally.
          load: true
          tags: zws-cloud:ci-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'ci' }}
            APP_COMMIT=${{ github.sha }}
            APP_SOURCE_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image exists locally
        run: |
          docker image inspect zws-cloud:ci-${{ github.sha }} > /dev/null
          docker images zws-cloud:ci-${{ github.sha }}

      - name: Report image size
        run: |
          SIZE="$(docker image inspect zws-cloud:ci-${{ github.sha }} --format='{{.Size}}')"
          echo "image_size_bytes=${SIZE}"
          echo "image_size_human=$(numfmt --to=iec "$SIZE")"