name: ci

# Production CI for zwscloud.in: typecheck, lint, unit tests, Docker build,
# image verification and publish. Runs on GitHub-hosted runners so the
# production VPS is never used as a build machine.
# Pushes an immutable, sha-tagged image to GHCR. `latest` is never published.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Typecheck, lint, test, Docker build, image verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://zwscloud_app:zwscloud_app@127.0.0.1:5433/zwscloud?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      ZWS_SKIP_SETTINGS_DB_DURING_BUILD: "1"
      ZWS_ALLOW_PRODUCTION_DATABASE_ACCESS: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zwscloud
          POSTGRES_USER: zwscloud_app
          POSTGRES_PASSWORD: zwscloud_app
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U zwscloud_app -d zwscloud"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prisma generate
        run: ./node_modules/.bin/prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test
        env:
          NODE_OPTIONS: --max-old-space-size=8192 --no-deprecation --expose-gc

      - name: Build
        run: pnpm build
        env:
          ZWS_SKIP_SETTINGS_DB_DURING_BUILD: "1"

      - name: Reclaim disposable runner disk space before Docker build
        # GitHub-hosted Ubuntu runners ship with several large SDKs this app does
        # not use. Docker BuildKit needs free space to load the verified image.
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/powershell /usr/local/share/chromium || true
          docker system prune -af --volumes || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          load: true
          tags: zws-cloud:ci-${{ github.sha }}

      - name: Verify the image exists locally
        run: docker image inspect zws-cloud:ci-${{ github.sha }}

      - name: Verify standalone artifact inside the image
        run: |
          docker run --rm zws-cloud:ci-${{ github.sha }} \
            sh -c 'test -f /app/.next/standalone/server.js && test -f /app/.next/BUILD_ID && test -f /app/prisma/schema.prisma'

      - name: Publish the verified image
        if: github.event_name == 'push'
        run: |
          docker tag zws-cloud:ci-${{ github.sha }} ghcr.io/lucky-uedc/zws-cloud-production:${{ github.sha }}
          docker push ghcr.io/lucky-uedc/zws-cloud-production:${{ github.sha }}
