map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=zws_global:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=zws_auth:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=zws_conn:10m;

# Upstream hosts are resolved once when nginx parses its config, which pins a
# stale container IP. Every deploy recreates the app container with a new IP and
# nginx then returns 502 until someone reloads it by hand. Resolving per request
# via Docker's embedded DNS (127.0.0.11) removes that whole failure mode.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    listen [::]:80;
    server_name ${SITE_DOMAIN};

    # Resolved per request so a recreated app container is picked up automatically.
    set $zws_app_upstream http://app:3000;
    set $zws_console_upstream http://worker:3001;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # Container-local health probe. Served by nginx itself so it stays
    # green even while the app reports degraded (optional integrations
    # such as Evolution API are legitimately unconfigured on a fresh install).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/health {
        limit_req zone=zws_global burst=20 nodelay;
        proxy_pass $zws_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${SITE_DOMAIN};

    # Resolved per request so a recreated app container is picked up automatically.
    set $zws_app_upstream http://app:3000;
    set $zws_console_upstream http://worker:3001;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZWS_SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100M;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml font/woff2;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), usb=(), interest-cohort=()" always;
    # This header is sent in addition to the app's own CSP (next.config.mjs). When a
    # response carries several CSP headers the browser enforces the INTERSECTION of
    # them, so a directive omitted here silently narrows the app's policy. Without an
    # explicit frame-src this falls back to `default-src 'self'`, which blocks the
    # Razorpay Checkout iframe (https://api.razorpay.com/v1/checkout/public) and makes
    # Chrome render "This content is blocked." in the modal. Keep frame-src in sync
    # with next.config.mjs, listing only gateway origins - no wildcards.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self' https://api.cashfree.com https://sandbox.cashfree.com https://secure.phonepe.com https://mercury.phonepe.com https://api.razorpay.com https://checkout.razorpay.com; frame-src 'self' https://sdk.cashfree.com https://api.cashfree.com https://sandbox.cashfree.com https://secure.phonepe.com https://mercury.phonepe.com https://api.razorpay.com https://checkout.razorpay.com https://challenges.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://sdk.cashfree.com https://checkout.razorpay.com https://cdn.razorpay.com https://www.googletagmanager.com https://www.google-analytics.com https://challenges.cloudflare.com https://static.cloudflareinsights.com; connect-src 'self' https: wss: https://lumberjack.razorpay.com;" always;

    limit_conn zws_conn 80;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(login|zwsloginsam) {
        limit_req zone=zws_auth burst=10 nodelay;
        proxy_pass $zws_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    # API responses must always be JSON, including when nginx itself is
    # the one tripping a rate limit. A bare nginx 503 HTML page used to
    # reach the OTP modal and surface as "API returned HTML instead of JSON".
    location @rate_limited_json {
        internal;
        default_type application/json;
        return 429 '{"success":false,"error":"Too many requests. Please slow down and try again."}';
    }

    location /api/ {
        limit_req zone=zws_global burst=80 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited_json;
        proxy_pass $zws_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/api/console/proxy/(vnc|serial)/(.+)$ {
        limit_req zone=zws_global burst=40 nodelay;
        proxy_pass $zws_console_upstream/console/proxy/$1/$2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/vnc/proxy/(.+)$ {
        limit_req zone=zws_global burst=40 nodelay;
        proxy_pass $zws_console_upstream/vnc/proxy/$1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        limit_req zone=zws_global burst=80 nodelay;
        proxy_pass $zws_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }
}
